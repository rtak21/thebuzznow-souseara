<title>Relatório Sou Seara</title>
<style id="tokens">
/* Layout: editor de 3 colunas (slides · preview 16:9 · formulário); slides em base 1920×1080 escalados. */
:root{
  /* Sou Seara — único lugar com hex */
  --seara-orange:#ff6201; --seara-red:#ed1c24; --seara-yellow:#fcf10f;
  --cream:#fde5c8; --off-white:#f9f9f9; --ink-wine:#160b10; --white:#ffffff;
  /* Papéis derivados */
  --positive:var(--ink-wine); --negative:var(--seara-red);
  --neutral:color-mix(in srgb, var(--ink-wine) 55%, var(--off-white));
  --series-current:var(--seara-orange); --series-prev:var(--neutral);
  --series-ig:var(--seara-orange); --series-fb:var(--ink-wine); --series-tt:var(--seara-red);
  --font-sans:"Lufga", system-ui, sans-serif;
  /* Interface do editor */
  --ui-bg:#f3efea; --ui-panel:#ffffff; --ui-fg:var(--ink-wine); --ui-muted:#6b5f63; --ui-line:#e2dad3;
  --ui-hover:#f6f1ec; --ui-accent:var(--seara-orange); --ui-accent-fg:var(--ink-wine); --ui-danger:#c4121a;
  --ui-stage:#2a1f23;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ui-bg:#120a0d; --ui-panel:#1d1317; --ui-fg:#f4ece6; --ui-muted:#b4a6a9; --ui-line:#33262b;
  --ui-hover:#271b20; --ui-danger:#ff6b6f; --ui-stage:#0b0608; color-scheme:dark}}
:root[data-theme="dark"]{
  --ui-bg:#120a0d; --ui-panel:#1d1317; --ui-fg:#f4ece6; --ui-muted:#b4a6a9; --ui-line:#33262b;
  --ui-hover:#271b20; --ui-danger:#ff6b6f; --ui-stage:#0b0608; color-scheme:dark}
</style>
<style id="fonts">

@font-face{font-family:"Lufga";src:url("fonts/Lufga-Italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Lufga";src:url("fonts/Lufga-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Lufga";src:url("fonts/Lufga-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Lufga";src:url("fonts/Lufga-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Lufga";src:url("fonts/Lufga-ExtraBold.woff2") format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Lufga";src:url("fonts/Lufga-Black.woff2") format("woff2");font-weight:900;font-display:swap}
</style>
<style id="slide-css">
/* ===== Slides (base 1920×1080, escala do DS ×1,5) ===== */
.slide{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:var(--font-sans);color:var(--ink-wine);
  background:var(--off-white);-webkit-print-color-adjust:exact;print-color-adjust:exact;box-sizing:border-box}
.slide *{box-sizing:border-box}
.bg-red{background:var(--seara-red);color:var(--white)}
.bg-orange{background:var(--seara-orange);color:var(--ink-wine)}
.bg-cream{background:var(--cream)}
.bg-white{background:var(--off-white)}
.s-pad{position:absolute;inset:96px 120px 120px;display:flex;flex-direction:column;gap:40px}
.t-display-xl{font-size:108px;line-height:108px;font-weight:900;letter-spacing:-.01em;margin:0}
.t-display-l{font-size:72px;line-height:78px;font-weight:800;margin:0}
.t-h1{font-size:48px;line-height:57px;font-weight:700;margin:0;text-wrap:balance}
.t-h2{font-size:36px;line-height:45px;font-weight:700;margin:0}
.t-h3{font-size:30px;line-height:39px;font-weight:600;margin:0}
.t-body{font-size:24px;line-height:36px;font-weight:400;margin:0}
.t-strong{font-size:24px;line-height:36px;font-weight:600}
.t-caption{font-size:20px;line-height:27px;font-weight:500}
.eyebrow{font-size:20px;line-height:27px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--seara-orange)}
.bg-white .eyebrow,.bg-cream .eyebrow{color:var(--ink-wine)}
.s-head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
.s-head .net-chip{display:inline-flex;align-items:center;gap:12px;font-size:24px;font-weight:700;padding:10px 22px;border-radius:999px;background:var(--seara-orange);color:var(--ink-wine)}
.s-foot{position:absolute;left:120px;right:120px;bottom:44px;display:flex;justify-content:space-between;align-items:center;font-size:20px;line-height:27px;font-weight:500;opacity:.85}
.tbn-corner{position:absolute;top:103px;right:120px;z-index:2}
/* Comparativo por rede */
.cmp{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:28px;flex:1;min-height:0}
.ctile{background:var(--white);border-radius:32px;padding:32px 40px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-width:0}
.ctile.hero{background:var(--seara-orange)}
.ctile .lbl{font-size:24px;line-height:30px;font-weight:600}
.ctile .flow{display:flex;align-items:baseline;gap:20px;flex-wrap:wrap}
.ctile .was{font-size:30px;font-weight:600;color:var(--neutral);text-decoration:line-through;text-decoration-thickness:2px}
.ctile.hero .was{color:var(--ink-wine);opacity:.6}
.ctile .arrow{font-size:36px;font-weight:900;color:var(--seara-orange)}
.ctile.hero .arrow{color:var(--ink-wine)}
.pill{align-self:flex-start;font-size:30px;line-height:1;font-weight:900;padding:14px 22px;border-radius:999px;white-space:nowrap}
.pill.up{background:var(--ink-wine);color:var(--seara-yellow)}
.pill.down{background:var(--seara-red);color:var(--white)}
.pill.flat{background:var(--cream);color:var(--ink-wine)}
.ctile.hero .pill.flat{background:var(--white)}
.animating .pill{opacity:0;transform:scale(.8)}
.animating.go .pill{opacity:1;transform:none;transition:opacity .6s var(--anim-ease),transform .6s var(--anim-ease);transition-delay:calc(var(--i,0)*var(--anim-stagger) + var(--anim-dur))}
.formula{font-size:20px;line-height:27px;font-weight:500}
.num{font-variant-numeric:tabular-nums}
.big{font-size:120px;line-height:1;font-weight:900;letter-spacing:-.02em}
.mid{font-size:72px;line-height:1;font-weight:900;letter-spacing:-.01em}
.var{font-size:22px;line-height:30px;font-weight:600;white-space:nowrap}
.var.up{color:var(--positive)} .var.down{color:var(--negative)} .var.flat{color:var(--neutral)}
.bg-red .var.up,.bg-red .var.down{color:var(--white)}
/* KPI */
.kpis{display:grid;gap:24px}
.kpi{background:var(--white);border-radius:32px;padding:36px 40px;display:flex;flex-direction:column;gap:14px;min-width:0}
.bg-white .kpi{background:var(--cream)}
.kpi .lbl{font-size:24px;line-height:30px;font-weight:600}
.kpi.hero{background:var(--seara-orange)}
.kpi.hero .var.down{color:var(--ink-wine)}
.split{display:flex;gap:10px;align-items:baseline;font-size:22px;line-height:28px;font-weight:600;white-space:nowrap}
.split b{font-weight:900}
/* Overview do mês */
.ov{display:grid;grid-template-columns:1fr 1fr;gap:0;flex:1;min-height:0}
.ov-left{display:flex;flex-direction:column;gap:20px;padding-right:56px}
.ov-right{display:flex;flex-direction:column;gap:20px;padding-left:56px;border-left:2px solid var(--cream)}
.ov-title{margin:0;font-size:24px;line-height:30px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--seara-orange)}
.ico{width:100%;height:100%;display:block}
.ov-row{display:grid;grid-template-columns:1.1fr 1fr 1.2fr;align-items:center;gap:20px;background:var(--cream);border-radius:28px;padding:22px 28px}
.ov-net{display:flex;align-items:center;gap:16px;font-size:30px;font-weight:700}
.ov-net .ico{width:56px;height:56px;flex:none;color:var(--seara-orange)}
.ov-cell{display:flex;flex-direction:column;align-items:center;gap:8px}
.ov-box{background:var(--white);border-radius:18px;padding:10px 20px;min-width:200px;text-align:center}
.ov-num{font-size:44px;line-height:1.1;font-weight:900}
.ov-cap{font-size:17px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.ov-row .pill{font-size:22px;padding:12px 18px;align-self:center}
.ov-row .pill.flat{background:var(--white)}
.ov-total{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:28px;background:var(--ink-wine);color:var(--cream);border-radius:28px;padding:26px 32px;font-size:30px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.ov-tnum{font-size:80px;line-height:1;font-weight:900;color:var(--seara-yellow);letter-spacing:-.01em;text-transform:none}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px 36px;flex:1}
.ov-metric{display:flex;flex-direction:column;gap:14px;min-width:0}
.ov-mlabel{display:flex;align-items:center;gap:14px;font-size:24px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.ov-mlabel .ico{width:52px;height:52px;color:var(--seara-orange)}
.ov-mbox{background:var(--cream);border-radius:28px;padding:30px;text-align:center}
.ov-metric .pill{align-self:stretch;text-align:center;font-size:24px;padding:14px}
/* Capa / divisória / encerramento */
.cover-word{position:absolute;display:flex;flex-direction:column;gap:0}
.cover-word .keynote,.tight .keynote{margin:-48px 0 -40px -12px}
.keynote{display:inline-block;line-height:0}
.cover-pill{display:inline-flex;align-self:flex-start;align-items:center;justify-content:center;background:var(--seara-orange);color:var(--off-white);border:6px solid var(--white);border-radius:999px;padding:4px 18px;box-shadow:-10px 10px 0 var(--seara-yellow);font-size:44px;line-height:1;font-weight:800;white-space:nowrap;margin-bottom:0}
.bg-orange .cover-pill{box-shadow:-10px 10px 0 var(--seara-red)}
.keynote svg{height:100%;width:auto;display:block}
.keynote-fallback{font-weight:900;color:var(--seara-orange);line-height:1;-webkit-text-stroke:.06em var(--white);paint-order:stroke fill;letter-spacing:-.01em}
.bg-white .keynote-fallback,.bg-cream .keynote-fallback{-webkit-text-stroke:0}
.raios{position:absolute;color:var(--seara-yellow)}
.raios svg{width:100%;height:auto;display:block}
.bg-white .raios,.bg-cream .raios{color:var(--seara-orange)}
.logo-ss{display:inline-flex;align-items:center;font-weight:900;color:var(--white);letter-spacing:-.01em}
.logo-ss svg{height:100%;width:auto}
.tbn{display:inline-block;color:var(--white)}
.tbn svg{height:100%;width:auto;display:block}
.tbn .t,.tbn .y{fill:currentColor}
.bg-white .tbn,.bg-cream .tbn{color:var(--ink-wine)}
.ss-juntos{display:inline-block}
.ss-juntos svg{width:100%;height:auto;display:block}
.ss-juntos .j-fill{fill:var(--j-fill)}.ss-juntos .j-stroke{fill:var(--j-stroke)}.ss-juntos .j-shadow{fill:var(--j-shadow)}
.ss-juntos--on-red{--j-fill:var(--seara-orange);--j-stroke:var(--white);--j-shadow:var(--seara-yellow)}
.ss-juntos--on-orange{--j-fill:var(--seara-orange);--j-stroke:var(--white);--j-shadow:var(--seara-red)}
.ss-juntos--on-white{--j-fill:var(--white);--j-stroke:var(--seara-orange);--j-shadow:var(--seara-orange)}
/* Cards de conteúdo */
.cards{display:flex;justify-content:center;align-items:flex-start;gap:24px;flex:1}
.pcard{display:flex;flex-direction:column;gap:14px;flex:none}
.frame{position:relative;border-radius:24px;overflow:hidden;background:var(--white);display:block;color:inherit;text-decoration:none}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame .empty{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:600;color:var(--neutral);border:3px dashed var(--neutral);border-radius:24px}
.frame .play{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:var(--seara-orange);color:var(--ink-wine);display:grid;place-items:center;font-size:22px}
.fmt-tag{font-size:18px;font-weight:600;color:var(--neutral);letter-spacing:.06em;text-transform:uppercase}
.pcard .cap{font-size:22px;line-height:30px;font-weight:500}
/* Top 3 */
.top3{display:grid;gap:40px;flex:1;min-height:0;justify-content:center}
.top{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start;min-width:0}
.rank{font-size:96px;line-height:.9;font-weight:900;color:var(--seara-orange)}
.top .metrics{display:grid;gap:12px;margin-top:20px}
.top .metrics div{display:flex;justify-content:space-between;gap:16px;font-size:24px;line-height:32px;border-bottom:2px solid var(--cream);padding-bottom:10px}
.top .metrics b{font-weight:800}
.bg-cream .top .metrics div{border-bottom-color:var(--white)}
.top .metrics .rate{background:var(--seara-orange);border:0;border-radius:16px;padding:12px 18px}
/* Comparativo */
/* Comentários / aprendizados */
.prints{display:flex;gap:28px;align-items:flex-start;justify-content:center;height:560px}
.print{height:100%;display:flex;flex-direction:column;gap:12px;align-items:center;min-width:0}
.print img{max-height:510px;max-width:100%;border-radius:20px;display:block;background:var(--white)}
.print span{font-size:20px;font-weight:600}
.note{background:var(--off-white);color:var(--ink-wine);border-radius:32px;padding:36px 44px;overflow:hidden}
.learn{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;flex:1}
.learn article{background:var(--cream);border-radius:32px;padding:48px 44px;display:flex;flex-direction:column;gap:20px;overflow:hidden}
.learn .n{width:72px;height:72px;border-radius:50%;background:var(--seara-orange);display:grid;place-items:center;font-size:36px;font-weight:900;color:var(--off-white)}
.fit{overflow:hidden}
/* Animações (só apresentação) */
.slide{--anim-dur:1s;--anim-stagger:180ms;--anim-ease:cubic-bezier(.65,0,.35,1)}
.animating [data-anim]{opacity:0;transform:translateY(32px)}
.animating.go [data-anim]{opacity:1;transform:none;transition:opacity var(--anim-dur) var(--anim-ease),transform var(--anim-dur) var(--anim-ease);transition-delay:calc(var(--i,0)*var(--anim-stagger))}
.animating .var{opacity:0}
.animating.go .var{opacity:1;transition:opacity .6s var(--anim-ease);transition-delay:calc(var(--i,0)*var(--anim-stagger) + var(--anim-dur))}
.animating .raios{transform:translateX(-120px);opacity:0}
.animating.go .raios{transform:none;opacity:1;transition:transform .8s var(--anim-ease) .7s,opacity .8s var(--anim-ease) .7s}
@media (prefers-reduced-motion: reduce){.animating [data-anim],.animating .pill,.animating .var,.animating .raios{opacity:1!important;transform:none!important;transition:none!important}}
</style>
<style>
/* ===== Editor ===== */
html,body{height:100%}
body{background:var(--ui-bg);color:var(--ui-fg);font-family:var(--font-sans);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ui-accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
.top-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 16px;background:var(--ui-panel);border-bottom:1px solid var(--ui-line)}
.brand{font-weight:900;font-size:16px;margin-right:4px}
.grp{display:flex;align-items:center;gap:6px;padding-left:12px;border-left:1px solid var(--ui-line)}
.btn{border:1px solid var(--ui-line);background:var(--ui-panel);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--ui-hover)}
.btn.primary{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--ui-accent-fg)}
.btn.danger{color:var(--ui-danger)}
.btn.sm{padding:5px 9px;font-size:12px}
.status{margin-left:auto;font-size:12px;color:var(--ui-muted);display:flex;align-items:center;gap:8px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--ui-muted)}
.status.dirty .dot{background:var(--ui-accent)}
input[type=month]{border:1px solid var(--ui-line);border-radius:10px;padding:6px 8px;background:var(--ui-panel)}
.main{display:grid;grid-template-columns:240px 1fr 400px;min-height:0}
.list{overflow:auto;border-right:1px solid var(--ui-line);background:var(--ui-panel);padding:10px}
.list button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13px}
.list button:hover{background:var(--ui-hover)}
.list button[aria-current="true"]{background:var(--ui-accent);color:var(--ui-accent-fg);font-weight:700}
.list .n{width:22px;font-variant-numeric:tabular-nums;color:inherit;opacity:.7;font-size:12px}
.list .off{opacity:.45;text-decoration:line-through}
.list .warn{margin-left:auto;color:var(--ui-danger);font-weight:900}
.stage{background:var(--ui-stage);display:grid;place-items:center;min-width:0;min-height:0;overflow:hidden;position:relative}
.stage-inner{width:1920px;height:1080px;transform-origin:center;box-shadow:0 20px 60px rgba(0,0,0,.35);flex:none}
.stage-badge{position:absolute;top:12px;left:12px;background:var(--ui-panel);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600}
.form{overflow:auto;background:var(--ui-panel);border-left:1px solid var(--ui-line);padding:18px 18px 40px;display:flex;flex-direction:column;gap:16px}
.form h2{font-size:18px;margin:0}
.form .help{font-size:12px;color:var(--ui-muted);margin:0;line-height:1.5}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl-sm{font-size:12px;font-weight:600}
.field input,.field textarea,.field select{border:1px solid var(--ui-line);border-radius:10px;padding:8px 10px;background:var(--ui-bg)}
.field textarea{resize:vertical;min-height:90px;line-height:1.5}
.field .count{font-size:11px;color:var(--ui-muted);align-self:flex-end;font-variant-numeric:tabular-nums}
.field .err{font-size:12px;color:var(--ui-danger)}
.field input[aria-invalid="true"]{border-color:var(--ui-danger)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.box{border:1px solid var(--ui-line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.box-head{display:flex;align-items:center;gap:8px;justify-content:space-between}
.thumb{position:relative;width:88px;flex:none;border-radius:8px;overflow:hidden;background:var(--ui-bg);cursor:crosshair;touch-action:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.thumb i{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid var(--white);border-radius:50%;box-shadow:0 0 0 2px var(--ink-wine);pointer-events:none}
.card-row{display:flex;gap:12px}
.card-row .fields{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.card-row[draggable="true"]{cursor:grab}
.card-row.drag-over{outline:2px dashed var(--ui-accent);outline-offset:4px;border-radius:10px}
.alert{border-radius:10px;padding:10px 12px;font-size:12px;background:color-mix(in srgb,var(--ui-danger) 14%,transparent);color:var(--ui-fg)}
.info{border-radius:10px;padding:10px 12px;font-size:12px;background:var(--ui-hover);line-height:1.5}
dialog{border:0;border-radius:18px;padding:24px;max-width:520px;width:calc(100% - 32px);background:var(--ui-panel);color:var(--ui-fg);box-shadow:0 30px 80px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(22,11,16,.55)}
dialog h3{margin:0 0 10px;font-size:18px}
dialog p{margin:0 0 12px;line-height:1.5}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.narrow{display:none;position:fixed;inset:0;z-index:30;background:var(--ui-bg);padding:32px 16px;text-align:center;flex-direction:column;align-items:center;justify-content:center;gap:16px}
@media (max-width:1279px){.narrow{display:flex}}
/* Apresentação */
.present{position:fixed;inset:0;z-index:50;background:var(--ink-wine);display:grid;place-items:center;overflow:hidden;cursor:none}

<script>
/*
 * Relatório Mensal Sou Seara — app de página única, sem backend.
 * Segurança (spec §10):
 *  1. RLS: não há banco. N/A.
 *  2. Autorização no frontend: não há permissões; dados ficam no navegador de cada um. N/A.
 *  3. IDOR: não há rotas nem IDs no servidor. N/A.
 *  4. Segredos: nenhuma chave no código.
 *  5. Input: todo texto do usuário entra via textContent (helper h()); uploads checados por MIME + magic bytes;
 *     links por allowlist de host exato; JSON carregado passa por sanitize() (campos desconhecidos descartados,
 *     limites de caracteres reaplicados).
 */
"use strict";
const SCHEMA = 1;
const NETS = ["instagram","facebook","tiktok"];
const NET_NAME = {instagram:"Instagram",facebook:"Facebook",tiktok:"TikTok"};
const NET_SERIES = {instagram:"var(--series-ig)",facebook:"var(--series-fb)",tiktok:"var(--series-tt)"};
const FORMATS = {"feed-4x5":["Feed",4/5],"carrossel-4x5":["Carrossel",4/5],"reels-9x16":["Reels",9/16],"stories-9x16":["Stories",9/16],"video-9x16":["Vídeo",9/16],"post-1x1":["Post",1]};
const BASES = {reach:"alcance",views:"visualizações",followers:"seguidores"};
const LIM = {overviewText:1600, analysis:600, caption:60, comments:800, ltitle:50, ltext:220, title:80, contact:120};
const URL_HOSTS = new Set(["instagram.com","www.instagram.com","facebook.com","www.facebook.com","m.facebook.com","fb.watch","tiktok.com","www.tiktok.com","vm.tiktok.com"]);
const MONTHS = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DRAFT_KEY = "sou-seara-relatorio-draft";

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids){
  const el = tag.includes(":") ? document.createElementNS("http://www.w3.org/2000/svg", tag.split(":")[1]) : document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v == null || v === false) continue;
    if (k === "class") el.setAttribute("class", v);
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; el.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return el;
}
const $ = s => document.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)+Date.now().toString(36));
const fmtInt = n => new Intl.NumberFormat("pt-BR").format(n);
function fmtAbbr(n){
  if (n == null || !isFinite(n)) return "—";
  if (Math.abs(n) >= 1e6) return new Intl.NumberFormat("pt-BR",{maximumFractionDigits:2}).format(n/1e6)+" mi";
  if (Math.abs(n) >= 1e4) return new Intl.NumberFormat("pt-BR",{maximumFractionDigits:1}).format(n/1e3)+" mil";
  return fmtInt(Math.round(n));
}
const fmtPct = (n, d) => (n == null || !isFinite(n)) ? "—" : new Intl.NumberFormat("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d}).format(n)+"%";
function monthLabel(m){ const [y,mo] = (m||"").split("-").map(Number); return (y && mo) ? `${MONTHS[mo-1]} ${y}` : ""; }
function prevMonthOf(d){ const t = new Date(d.getFullYear(), d.getMonth()-1, 1); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}`; }
function parseNum(s){
  const t = String(s ?? "").trim().replace(/[.\s]/g,"");
  if (t === "") return {ok:true, v:0};
  if (!/^\d+$/.test(t)) return {ok:false};
  return {ok:true, v:Number(t)};
}
function validUrl(s){
  if (!s) return true;
  try { const u = new URL(s); return u.protocol === "https:" && URL_HOSTS.has(u.hostname); } catch { return false; }
}

/* ---------- estado ---------- */
function emptyNet(){ return {followers:0,posts:0,postsOwn:0,postsCollab:0,reach:0,views:0,interactions:0,analysis:"",
  top:[0,1,2].map(emptyTop)}; }
function emptyTop(){ return {image:null,format:"feed-4x5",url:"",views:0,reach:0,interactions:0,focalX:50,focalY:50}; }
const TOP_MAX = 5;
function emptyState(month){
  return {schemaVersion:SCHEMA, client:"sou-seara", month, title:"Relatório de Social", contactLine:"", overviewText:{title:"Overview",text:""},
    engagementConfig:{instagram:{base:"reach"},facebook:{base:"reach"},tiktok:{base:"reach"}},
    hiddenSlides:[], previousManual:null, previousSnapshot:null,
    networks:{instagram:emptyNet(),facebook:emptyNet(),tiktok:emptyNet()},
    comments:{prints:[],analysis:""},
    learnings:[0,1,2].map(()=>({title:"",text:""}))};
}
let S = emptyState(prevMonthOf(new Date()));
let PREV = null;            // JSON do mês anterior (somente leitura)
let dirty = false, savedAt = null, current = "capa";
const overflowWarn = new Set();

/* migrações: uma função por versão (v -> v+1) */
const MIGRATIONS = {};
function migrate(d){ let v = d.schemaVersion; while (v < SCHEMA){ if (!MIGRATIONS[v]) throw new Error("versão sem migração"); d = MIGRATIONS[v](d); v = d.schemaVersion; } return d; }

/* sanitize: monta um objeto novo só com os campos conhecidos */
const str = (v, max) => typeof v === "string" ? v.slice(0, max) : "";
const num = v => (typeof v === "number" && isFinite(v) && v >= 0) ? Math.floor(v) : 0;
const pct = v => (typeof v === "number" && isFinite(v)) ? Math.min(100, Math.max(0, v)) : 50;
const img = v => (typeof v === "string" && /^data:image\/(webp|jpeg|png);base64,[A-Za-z0-9+/=]+$/.test(v)) ? v : null;
const fmt = v => FORMATS[v] ? v : "feed-4x5";
const url = v => (typeof v === "string" && validUrl(v)) ? v : "";
function sanitize(raw){
  if (!raw || typeof raw !== "object") throw new Error("O arquivo não é um JSON de relatório.");
  if (raw.client !== "sou-seara") throw new Error("Este JSON não é de um relatório Sou Seara.");
  if (typeof raw.schemaVersion !== "number" || raw.schemaVersion < 1) throw new Error("JSON sem versão de schema válida.");
  if (raw.schemaVersion > SCHEMA) throw new Error("Este JSON foi feito por uma versão mais nova do relatório.");
  raw = migrate(raw);
  if (typeof raw.month !== "string" || !/^\d{4}-(0[1-9]|1[0-2])$/.test(raw.month)) throw new Error("Mês de referência inválido no JSON.");
  const o = emptyState(raw.month);
  o.title = str(raw.title, LIM.title) || o.title;
  o.contactLine = str(raw.contactLine, LIM.contact);
  o.overviewText = {title: str(raw.overviewText?.title, LIM.ltitle) || "Overview", text: str(raw.overviewText?.text, LIM.overviewText)};
  for (const n of NETS){
    const b = raw.engagementConfig?.[n]?.base;
    if (BASES[b]) o.engagementConfig[n].base = b;
    const r = raw.networks?.[n]; if (!r || typeof r !== "object") continue;
    const t = o.networks[n];
    for (const k of ["followers","posts","postsOwn","postsCollab","reach","views","interactions"]) t[k] = num(r[k]);
    t.analysis = str(r.analysis, LIM.analysis);
    if (Array.isArray(r.top)) t.top = r.top.slice(0,TOP_MAX).map(c => ({image: img(c?.image), format: fmt(c?.format), url: url(c?.url),
      views: num(c?.views), reach: num(c?.reach), interactions: num(c?.interactions), focalX: pct(c?.focalX), focalY: pct(c?.focalY)}));
  }
  o.hiddenSlides = (Array.isArray(raw.hiddenSlides) ? raw.hiddenSlides : []).filter(x => typeof x === "string" && /^[a-z0-9-]{1,40}$/.test(x));
  if (raw.previousManual && typeof raw.previousManual === "object"){
    o.previousManual = {};
    for (const n of NETS){ const p = raw.previousManual[n] || {}; o.previousManual[n] = {followers:num(p.followers),posts:num(p.posts),reach:num(p.reach),views:num(p.views),interactions:num(p.interactions)}; }
  }
  const ps = raw.previousSnapshot;
  if (ps && typeof ps === "object" && typeof ps.month === "string" && /^\d{4}-(0[1-9]|1[0-2])$/.test(ps.month)){
    o.previousSnapshot = {month: ps.month, networks:{}};
    for (const n of NETS){ const p = ps.networks?.[n] || {}; o.previousSnapshot.networks[n] = {followers:num(p.followers),posts:num(p.posts),reach:num(p.reach),views:num(p.views),interactions:num(p.interactions)}; }
  }
  o.comments.prints = (Array.isArray(raw.comments?.prints) ? raw.comments.prints : []).map(p => ({image: img(p?.image), network: NETS.includes(p?.network) ? p.network : "instagram"})).filter(p => p.image).slice(0,4);
  o.comments.analysis = str(raw.comments?.analysis, LIM.comments);
  (Array.isArray(raw.learnings) ? raw.learnings : []).slice(0,3).forEach((l,i) => { o.learnings[i] = {title: str(l?.title, LIM.ltitle), text: str(l?.text, LIM.ltext)}; });
  return o;
}

/* ---------- cálculos ---------- */
/* Prioridade: JSON anterior carregado agora > números gravados no próprio .json (previousSnapshot) > digitados à mão */
function prevNet(n){
  if (PREV) return PREV.networks[n];
  if (S.previousSnapshot) return S.previousSnapshot.networks[n];
  if (S.previousManual) return S.previousManual[n];
  return null;
}
const hasPrev = () => !!(PREV || S.previousSnapshot || S.previousManual);
const prevMonth = () => PREV?.month || S.previousSnapshot?.month || null;
/* Só os números do mês anterior (sem imagens/textos) vão junto no .json do mês atual */
function snapshotOf(p){ const o = {month:p.month, networks:{}};
  for (const n of NETS){ const x = p.networks[n]; o.networks[n] = {followers:x.followers,posts:x.posts,reach:x.reach,views:x.views,interactions:x.interactions}; }
  return o; }
function rate(n, m){
  const base = S.engagementConfig[n].base;
  const den = base === "followers" ? S.networks[n].followers : m[base];
  return (den > 0) ? (m.interactions / den * 100) : null;
}
function prevRate(n){ const p = prevNet(n); if (!p) return null;
  const base = S.engagementConfig[n].base; const den = p[base]; return den > 0 ? p.interactions/den*100 : null; }
function variation(cur, prev){
  if (prev == null) return null;
  if (prev === 0) return cur > 0 ? {novo:true} : {v:0};
  return {v:(cur - prev) / prev * 100};
}
function formula(n){ return `Taxa de engajamento = interações ÷ ${BASES[S.engagementConfig[n].base]} × 100`; }

/* ---------- assets da marca (arquivos publicados junto) ---------- */
const ASSETS = {juntos:null, raios3:null, raios2:null, raios2reto:null, tbn:null, keynote:{}, logo:{}};
const KEYNOTE_WORDS = ["relatorio","instagram","facebook","tiktok","obrigada"];
const SAFE_TAGS = new Set(["svg","path","g","defs","clippath","lineargradient","stop","use","polygon","rect","circle","ellipse","title"]);
function sanitizeSvg(text){
  const doc = new DOMParser().parseFromString(text, "image/svg+xml");
  const root = doc.documentElement;
  if (!root || root.nodeName.toLowerCase() !== "svg" || doc.querySelector("parsererror")) return null;
  const walk = el => {
    for (const c of [...el.children]){
      if (!SAFE_TAGS.has(c.nodeName.toLowerCase())) { c.remove(); continue; }
      walk(c);
    }
    for (const a of [...el.attributes]){
      const n = a.name.toLowerCase();
      if (n.startsWith("on")) el.removeAttribute(a.name);
      else if ((n === "href" || n === "xlink:href") && !a.value.startsWith("#")) el.removeAttribute(a.name);
      else if (n === "style" && /url\(|expression|javascript/i.test(a.value)) el.removeAttribute(a.name);
    }
  };
  walk(root);
  return root;
}
async function loadSvg(path){
  try { const r = await fetch(path, {cache:"no-cache"}); if (!r.ok) return null; return sanitizeSvg(await r.text()); } catch { return null; }
}
async function loadAssets(){
  const jobs = [
    loadSvg("assets/juntos-sticker.svg").then(s => ASSETS.juntos = s),
    loadSvg("assets/raios-3-centro.svg").then(s => { if (s){ s.setAttribute("fill","currentColor"); } ASSETS.raios3 = s; }),
    loadSvg("assets/raios-2-angulo-direita.svg").then(s => { if (s){ s.setAttribute("fill","currentColor"); } ASSETS.raios2 = s; }),
    loadSvg("assets/raios-2-reto-direita.svg").then(s => { if (s){ s.setAttribute("fill","currentColor"); } ASSETS.raios2reto = s; }),
    loadSvg("assets/tbn-logo.svg").then(s => ASSETS.tbn = s),
    ...["dark","light"].map(v => loadSvg(`svg/logo-sou-seara--on-${v}.svg`).then(s => ASSETS.logo[v] = s)),
  ];
  for (const w of KEYNOTE_WORDS) for (const bg of ["red","orange","white"])
    jobs.push(loadSvg(`svg/keynote-${w}--on-${bg}.svg`).then(s => { if (s) ASSETS.keynote[`${w}--${bg}`] = s; }));
  await Promise.all(jobs);
}
const clone = n => n ? n.cloneNode(true) : null;
const KEYNOTE_LABEL = {relatorio:"relatório",instagram:"Instagram",facebook:"Facebook",tiktok:"TikTok",obrigada:"obrigada!"};
const warnedKeynote = new Set();
function nudge(el, y){ if (y){ el.style.position = "relative"; el.style.top = y + "px"; } return el; }
function hasKeynote(word, bg){ return !!ASSETS.keynote[`${word}--${bg}`]; }
function keynote(word, bg, height){
  const svg = ASSETS.keynote[`${word}--${bg}`];
  if (svg){ const s = clone(svg); s.setAttribute("role","img"); s.setAttribute("aria-label",KEYNOTE_LABEL[word]); return h("span",{class:"keynote",style:{height:height+"px"}}, s); }
  if (!warnedKeynote.has(word+bg)){ warnedKeynote.add(word+bg); console.info(`[relatório] SVG Keynote ausente: svg/keynote-${word}--on-${bg}.svg — usando Lufga 900.`); }
  return h("span",{class:"keynote-fallback",style:{fontSize:Math.round(height*0.9)+"px"}, text:KEYNOTE_LABEL[word]});
}
function raios(kind, style){ const s = clone(kind === "2reto" ? ASSETS.raios2reto : kind === 2 ? ASSETS.raios2 : ASSETS.raios3); return s ? h("span",{class:"raios",style,"aria-hidden":"true"}, s) : null; }
function tbn(height){ const s = clone(ASSETS.tbn); return s ? h("span",{class:"tbn",style:{height:height+"px"},role:"img","aria-label":"TBN"}, s) : h("span",{class:"t-caption",text:"TBN"}); }
function logoSS(onDark, height){
  const s = clone(ASSETS.logo[onDark ? "dark" : "light"]);
  if (s) return h("span",{class:"logo-ss",style:{height:height+"px"},role:"img","aria-label":"Sou Seara"}, s);
  return h("span",{class:"logo-ss",style:{fontSize:Math.round(height*0.62)+"px",color:onDark?"var(--white)":"var(--seara-orange)"},text:"Sou Seara"});
}
function juntos(mod, width){ const s = clone(ASSETS.juntos); return s ? h("span",{class:`ss-juntos ss-juntos--${mod}`,style:{width:width+"px"},role:"img","aria-label":"Juntos todos os dias"}, s) : null; }


/* Ícones simples desenhados no próprio SVG (sem dependência externa) */
function svgIcon(vb, ...kids){ return h("svg:svg",{viewBox:vb,class:"ico","aria-hidden":"true"}, ...kids); }
function netIcon(n){
  if (n === "instagram") return svgIcon("0 0 24 24",
    h("svg:rect",{x:2.5,y:2.5,width:19,height:19,rx:5.5,fill:"none",stroke:"currentColor","stroke-width":2.4}),
    h("svg:circle",{cx:12,cy:12,r:4.3,fill:"none",stroke:"currentColor","stroke-width":2.4}),
    h("svg:circle",{cx:17.4,cy:6.6,r:1.4,fill:"currentColor"}));
  if (n === "facebook") return svgIcon("0 0 24 24",
    h("svg:circle",{cx:12,cy:12,r:11,fill:"currentColor"}),
    h("svg:path",{fill:"var(--off-white)",d:"M13.4 23v-8.2h2.8l.4-3.3h-3.2V9.4c0-.9.3-1.6 1.6-1.6h1.7V4.9a22 22 0 0 0-2.5-.1c-2.5 0-4.2 1.5-4.2 4.3v2.4H7.2v3.3H10V23z"}));
  return svgIcon("0 0 24 24", h("svg:path",{fill:"currentColor",d:"M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.2v12.4a2.6 2.6 0 1 1-2.6-2.6c.3 0 .6 0 .8.1V9.7a5.8 5.8 0 1 0 5 5.7V9.1a7.3 7.3 0 0 0 4.3 1.4V7.3a4.3 4.3 0 0 1-3.2-1.5z"}));
}
function metricIcon(k){
  if (k === "posts") return svgIcon("0 0 24 24", h("svg:path",{fill:"currentColor",d:"M2 3h2.4v16.6H22V22H2z"}),
    ...[[7,11,8],[11,7,12],[15,9,10],[19,5,14]].map(([x,y,hh]) => h("svg:rect",{x,y,width:2.6,height:hh,rx:1.2,fill:"currentColor"})));
  if (k === "reach") return svgIcon("0 0 24 24", h("svg:path",{fill:"currentColor",d:"M12 4.5C6.5 4.5 2.4 8.6 1 12c1.4 3.4 5.5 7.5 11 7.5s9.6-4.1 11-7.5c-1.4-3.4-5.5-7.5-11-7.5zm0 12.3a4.8 4.8 0 1 1 0-9.6 4.8 4.8 0 0 1 0 9.6z"}),
    h("svg:circle",{cx:12,cy:12,r:2.6,fill:"currentColor"}));
  if (k === "views") return svgIcon("0 0 24 24", h("svg:circle",{cx:12,cy:7,r:3.4,fill:"currentColor"}), h("svg:circle",{cx:5,cy:9,r:2.5,fill:"currentColor"}), h("svg:circle",{cx:19,cy:9,r:2.5,fill:"currentColor"}),
    h("svg:path",{fill:"currentColor",d:"M5.5 20.5c0-4 2.9-7 6.5-7s6.5 3 6.5 7zM.5 19c0-3 1.8-5 4.3-5 .7 0 1.3.1 1.8.4A8.6 8.6 0 0 0 4.4 19zm23 0c0-3-1.8-5-4.3-5-.7 0-1.3.1-1.8.4a8.6 8.6 0 0 1 2.2 4.6z"}));
  return svgIcon("0 0 24 24", h("svg:path",{fill:"currentColor",d:"M12 21.5S2 15.3 2 8.6A5.1 5.1 0 0 1 12 6.4a5.1 5.1 0 0 1 10 2.2c0 6.7-10 12.9-10 12.9z"}));
}
/* ---------- deck ---------- */
function buildDeck(){
  const d = [];
  const autoHide = (id, cond) => ({id, auto: cond});
  d.push({...autoHide("capa",false), type:"capa", label:"Capa"});
  d.push({...autoHide("overview",false), type:"overview", label:"Overview do mês"});
  d.push({...autoHide("overview-texto", !S.overviewText.text.trim()), type:"texto", label:"Overview em texto"});
  for (const n of NETS) d.push({...autoHide(`comparativo-${n}`,!hasPrev()), type:"comparativo", net:n, label:`Comparativo — ${NET_NAME[n]}`});
  for (const n of NETS){
    const nm = NET_NAME[n], net = S.networks[n];
    d.push({...autoHide(`${n}-div`,false), type:"divisoria", net:n, label:`Divisória — ${nm}`});
    d.push({...autoHide(`${n}-overview`,false), type:"rede", net:n, label:`Overview ${nm}`});
    d.push({...autoHide(`${n}-top`, !net.top.some(t => t.image)), type:"top", net:n, label:`O que bombou — ${nm}`});
  }
  d.push({...autoHide("comentarios", !S.comments.prints.length && !S.comments.analysis.trim()), type:"comentarios", label:"Análise de comentários"});
  d.push({...autoHide("aprendizados",false), type:"aprendizados", label:"Aprendizados do mês"});
  d.push({...autoHide("encerramento",false), type:"encerramento", label:"Encerramento"});
  d.forEach(s => { s.key = s.key || s.id; s.manual = S.hiddenSlides.includes(s.id); s.hidden = s.manual || s.auto; });
  return d;
}
const visibleDeck = () => buildDeck().filter(s => !s.hidden);

/* ---------- render dos slides ---------- */
let animIdx = 0;
const A = (el) => { el.setAttribute("data-anim",""); el.style.setProperty("--i", animIdx++); return el; };
function footer(pageNo){
  return h("div",{class:"s-foot"},
    h("span",{}, `Sou Seara · ${S.title || "Relatório de Social"} · ${monthLabel(S.month)}`),
    h("span",{class:"num",text:String(pageNo).padStart(2,"0")}));
}
function tbnCorner(){ return h("div",{class:"tbn-corner"}, tbn(34)); }
function varEl(v, suffix){
  if (!v) return null;
  if (v.novo) return h("span",{class:"var up"},"▲ novo");

/* Capa: pílula do título vai até ~o "a" de "relatório" (47% da largura do destaque) */
function fitCoverPill(root){
  const pill = root.querySelector(".cover-pill"), kn = root.querySelector(".cover-word .keynote, .cover-word .keynote-fallback");
  if (!pill || !kn || !kn.offsetWidth) return;
  const target = kn.offsetWidth * (kn.classList.contains("keynote") ? 0.40 : 0.47), txt = pill.firstChild;
  pill.style.width = ""; pill.style.fontSize = "44px";
  const pad = pill.offsetWidth - txt.offsetWidth;
  const fs = Math.max(26, Math.min(64, 44 * (target - pad) / txt.offsetWidth));
  pill.style.fontSize = fs + "px";
  pill.style.width = Math.max(target, txt.offsetWidth + pad) + "px";
}
/* Ajuste de texto: reduz até −15%; passando disso, marca alerta */
function fitText(root, key){
  fitCoverPill(root);
  let bad = false;
  root.querySelectorAll("[data-fit]").forEach(el => {
    el.style.fontSize = ""; el.style.lineHeight = "";
    const base = parseFloat(getComputedStyle(el).fontSize), lh = parseFloat(getComputedStyle(el).lineHeight) / base;
    const box = el.classList.contains("note") ? el : el;
    let f = 1;
    while (box.scrollHeight > box.clientHeight + 1 && f > 0.85){ f -= 0.03; el.style.fontSize = (base*f)+"px"; el.style.lineHeight = (base*f*lh)+"px";
      el.querySelectorAll("p").forEach(p => { p.style.fontSize = (base*f)+"px"; p.style.lineHeight = (base*f*lh)+"px"; }); }
    if (box.scrollHeight > box.clientHeight + 1) bad = true;
  });
  if (key){ const had = overflowWarn.has(key); bad ? overflowWarn.add(key) : overflowWarn.delete(key); return had !== bad; }
  return false;
}

function thumb(item, onchange){

/* ---------- Sugestões via Gem (Gemini) ----------
 * Sem chamada de rede: o app copia os dados do mês; a analista cola no Gem
 * "Aprendizados Sou Seara" e cola a resposta de volta. Instruções do Gem: gem/instrucoes-gem.md */
const GEM_URL = "https://gemini.google.com/gem/1dCFxiQjZqzRJKOw_AktVgpPDwpMXjgto?usp=sharing";
let aiSuggestions = [];
function gemPayload(){
  const r1 = x => x == null ? null : Math.round(x*10)/10, r2 = x => x == null ? null : Math.round(x*100)/100;
  const redes = {};
  for (const n of NETS){
    const c = S.networks[n], p = prevNet(n), v = k => p ? (variation(c[k], p[k])?.novo ? "novo" : r1(variation(c[k], p[k])?.v)) : null;
    const rt = rate(n,c), prt = prevRate(n);
    redes[NET_NAME[n]] = {seguidores:c.followers, publicacoes:c.posts, ...(n === "instagram" ? {publicacoes_nossas:c.postsOwn, publicacoes_collab:c.postsCollab} : {}), alcance:c.reach, visualizacoes:c.views, interacoes:c.interactions,
      taxa_engajamento_pct:r2(rt), base_da_taxa:BASES[S.engagementConfig[n].base],
      variacao_pct:{seguidores:v("followers"), publicacoes:v("posts"), alcance:v("reach"), visualizacoes:v("views"), interacoes:v("interactions"),
        taxa_engajamento:(rt != null && prt != null) ? r1(variation(rt,prt)?.v) : null},
      analise:c.analysis || ""};
  }
  const top = {};
  for (const n of NETS) top[NET_NAME[n]] = S.networks[n].top.map((t,i) => ({posicao:i+1, formato:FORMATS[t.format][0], visualizacoes:t.views, alcance:t.reach, interacoes:t.interactions, taxa_pct:r2(rate(n,t))}));
  return "RELATORIO_SOU_SEARA v1\n" + JSON.stringify({mes:monthLabel(S.month), mes_anterior_disponivel:hasPrev(), redes, top_posts:top,
    comentarios:S.comments.analysis || "", aprendizados_atuais:S.learnings.filter(l => l.title || l.text).map(l => ({titulo:l.title, descricao:l.text}))}, null, 1);
}
function parseGem(text){
  const m = text.match(/```(?:json)?\s*([\s\S]*?)```/) || text.match(/(\{[\s\S]*\})/);
  if (!m) throw new Error("Não encontrei o bloco JSON na resposta. Copie a resposta inteira do Gem.");
  let d; try { d = JSON.parse(m[1]); } catch { throw new Error("A resposta do Gem veio com o JSON incompleto. Peça para ele responder de novo."); }
  const list = Array.isArray(d?.aprendizados) ? d.aprendizados : [];
  const out = list.map(a => ({title:str(a?.titulo, LIM.ltitle).trim(), text:str(a?.descricao, LIM.ltext).trim(), base:str(a?.base, 200).trim()})).filter(a => a.title || a.text).slice(0, 8);
  if (!out.length) throw new Error("A resposta não trouxe aprendizados no formato esperado.");
  return out;
}

/* ---------- imagens ---------- */
let imgCb = null;
function pickImage(cb){ imgCb = cb; $("#file-img").value = ""; $("#file-img").click(); }
async function sniff(file){
  const b = new Uint8Array(await file.slice(0,12).arrayBuffer());
  const is = (o,arr) => arr.every((v,i) => b[o+i] === v);
  if (is(0,[0xFF,0xD8,0xFF])) return "image/jpeg";
  if (is(0,[0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A])) return "image/png";
  if (is(0,[0x52,0x49,0x46,0x46]) && is(8,[0x57,0x45,0x42,0x50])) return "image/webp";
  return null;
}
async function processImage(file){
  if (file.size > 15*1024*1024) throw new Error("A imagem passa de 15 MB.");
  const real = await sniff(file);
  if (!["image/jpeg","image/png","image/webp"].includes(file.type)) throw new Error("Use JPG, PNG ou WebP. SVG, GIF e PDF não são aceitos.");
  if (!real || real !== file.type) throw new Error("O conteúdo do arquivo não é uma imagem JPG, PNG ou WebP válida (a extensão não basta).");
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1200 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  let out = c.toDataURL("image/webp", 0.82);
  if (!out.startsWith("data:image/webp")) out = c.toDataURL("image/jpeg", 0.82);
  return out;
}
$("#file-img").addEventListener("change", async e => {
  const file = e.target.files[0]; if (!file || !imgCb) return;
  try { const d = await processImage(file); const cb = imgCb; imgCb = null; await cb(d); }
  catch (err){ dialog("Imagem recusada", err.message, [["Ok"]]); }
});

  let idx = 0, cur = null;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const scale = () => { const k = Math.min(innerWidth/1920, innerHeight/1080); ov.querySelectorAll(".pslide").forEach(p => p.style.transform = `translate(-50%,-50%) scale(${k})`); };
  const show = i => {
    idx = Math.max(0, Math.min(slides.length-1, i));
    const wrap = h("div",{class:"pslide",style:{opacity:"0"}}); const sl = slides[idx].cloneNode(true); wrap.append(sl); ov.append(wrap);
    const key = deck[idx].key;
    if (!reduce){ sl.classList.add("animating"); requestAnimationFrame(() => requestAnimationFrame(() => sl.classList.add("go"))); }
    if (!reduce && !seenCount.has(key)) countUp(sl);
    seenCount.add(key);
    scale(); requestAnimationFrame(() => wrap.style.opacity = "1");
    if (cur){ const old = cur; old.style.opacity = "0"; setTimeout(() => old.remove(), 260); }
    cur = wrap; counter.textContent = `${String(idx+1).padStart(2,"0")} / ${String(slides.length).padStart(2,"0")}`;
  };
  const key = e => {
    if (["ArrowRight","ArrowDown"," ","PageDown"].includes(e.key)){ e.preventDefault(); show(idx+1); }
    else if (["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ e.preventDefault(); show(idx-1); }
    else if (e.key === "Home") show(0); else if (e.key === "End") show(slides.length-1);
    else if (e.key === "Escape") stop();
  };
  let mouseT = null;
  const move = () => { ov.classList.add("mouse"); clearTimeout(mouseT); mouseT = setTimeout(() => ov.classList.remove("mouse"), 2000); };
  ov.addEventListener("click", e => { if (e.target.closest("[data-link]")) return; e.clientX > innerWidth/2 ? show(idx+1) : show(idx-1); });
  ov.addEventListener("mousemove", move);
  const fs = () => { if (!document.fullscreenElement && P) stop(true); };
  function stop(fromFs){
    document.removeEventListener("keydown", key, true); removeEventListener("resize", scale); document.removeEventListener("fullscreenchange", fs);
    ov.remove(); P = null; if (!fromFs && document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  }
  document.addEventListener("keydown", key, true); addEventListener("resize", scale);
  P = {stop};
  const req = ov.requestFullscreen ? ov.requestFullscreen() : null;
  if (req) req.then(() => document.addEventListener("fullscreenchange", fs)).catch(() => {});
  show(0);
}
function countUp(root){
  root.querySelectorAll("[data-count]").forEach(el => {
    const target = Number(el.dataset.count), kind = el.dataset.kind, t0 = performance.now();
    const delay = Number(el.closest("[data-anim]")?.style.getPropertyValue("--i") || 0) * 180;
    const step = t => { const q = Math.max(0,(t-t0-delay)/1600), p = Math.min(1,q), v = target * (p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p+2,3)/2);
      el.textContent = kind === "pct" ? fmtPct(v,2) : fmtAbbr(p === 1 ? target : Math.round(v)); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

/* ---------- PDF (arquivo de impressão) ---------- */
async function fontDataUrls(){
  const css = $("#fonts").textContent; let out = css;
  for (const m of css.matchAll(/url\("(fonts\/[^"]+)"\)/g)){
    try { const b = await (await fetch(m[1])).blob();
      const d = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
      out = out.replace(m[0], `url("${d}")`); } catch {}
  }
  return out;
}
$("#btn-pdf").onclick = async () => {
  const deck = visibleDeck();
  const ok = await dialog("Exportar PDF", h("div",{},
    h("p",{text:"Vamos baixar um arquivo de impressão (.html) com os slides visíveis. Abra o arquivo no Chrome: a janela de impressão abre sozinha."}),
    h("p",{}, "No destino, escolha ", h("b",{},"Salvar como PDF"), ". Em Mais opções, marque ", h("b",{},"Gráficos de fundo"), ".")),
    [["Cancelar",false],["Baixar arquivo",true,true]]);
  if (!ok) return;
  const off = $("#offscreen"); off.replaceChildren();
  const html = deck.map((s,i) => { const el = renderSlide(s, i+1); off.append(el); fitText(el); return el.outerHTML; }).join("\n");
  off.replaceChildren();
  const fonts = await fontDataUrls();
  const doc = `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Sou Seara · ${monthLabel(S.month)}</title>
<style>${$("#tokens").textContent}</style><style>${fonts}</style><style>${$("#slide-css").textContent}
@page{size:1920px 1080px;margin:0}html,body{margin:0;padding:0;background:var(--ink-wine)}
.slide{break-after:page;page-break-after:always}.slide:last-child{break-after:auto}
@media screen{body{display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px 0}}
</style></head><body>${html}<script>document.fonts.ready.then(function(){setTimeout(function(){window.print()},300)})<\/script></body></html>`;
  if (window.top === window){ const w = window.open(""); if (w){ w.document.write(doc); w.document.close(); return; } }
  offerFile(`sou-seara-relatorio-${S.month}.html`, doc);
};

(async function boot(){

      if (yes){ S = st; $("#month").value = S.month; dirty = true; sizeDirty = true; refresh(); }
    }
  }
})();
